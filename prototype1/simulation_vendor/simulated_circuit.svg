<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 500" width="1060" height="500" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1060" height="500" fill="#ffffff"/>
  <g fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- supply rail (node vin) -->
    <path d="M60 70 H580"/>
    <!-- VIN source -->
    <path d="M60 70 V152 M60 188 V300"/>
    <circle cx="60" cy="170" r="18"/>
    <path d="M46 300 H74 M51 307 H69 M56 314 H64"/>
    <!-- C1 branch: CIN, RCIN, LCIN -->
    <path d="M170 70 V110 M154 110 H186 M154 122 H186 M170 122 V150"/>
    <rect x="160" y="150" width="20" height="50"/>
    <path d="M170 200 V220 a12 12 0 0 1 0 24 a12 12 0 0 1 0 24 V300"/>
    <path d="M156 300 H184 M161 307 H179 M166 314 H174"/>
    <!-- C2 branch: CBYP, RCBYP -->
    <path d="M290 70 V110 M274 110 H306 M274 122 H306 M290 122 V150"/>
    <rect x="280" y="150" width="20" height="50"/>
    <path d="M290 200 V300"/>
    <path d="M276 300 H304 M281 307 H299 M286 314 H294"/>
    <!-- VPWM source -->
    <path d="M250 370 V387 M250 423 V450"/>
    <circle cx="250" cy="405" r="18"/>
    <path d="M236 450 H264 M241 457 H259 M246 464 H254"/>
    <path d="M250 370 H340"/>
    <!-- driver block -->
    <rect x="340" y="335" width="150" height="80"/>
    <path d="M405 70 V335"/>
    <path d="M405 415 V450"/>
    <path d="M391 450 H419 M396 457 H414 M401 464 H409"/>
    <path d="M490 370 H560"/>
    <!-- primary: RP, LP -->
    <path d="M580 70 V90"/>
    <rect x="570" y="90" width="20" height="50"/>
    <path d="M580 140 V160 a15 15 0 0 0 0 30 a15 15 0 0 0 0 30 a15 15 0 0 0 0 30 a15 15 0 0 0 0 30 V355 H568"/>
    <!-- core -->
    <path d="M601 158 V282 M609 158 V282"/>
    <!-- Q1 -->
    <path d="M560 350 V390"/>
    <path d="M568 345 V395"/>
    <path d="M568 385 H580 V450"/>
    <path d="M566 450 H594 M571 457 H589 M576 464 H584"/>
    <!-- secondary: LS, RS -->
    <path d="M630 160 a15 15 0 0 1 0 30 a15 15 0 0 1 0 30 a15 15 0 0 1 0 30 a15 15 0 0 1 0 30 V300"/>
    <rect x="620" y="300" width="20" height="50"/>
    <path d="M630 350 V390 H960"/>
    <path d="M630 160 V70 H760"/>
    <!-- CW -->
    <path d="M710 70 V214 M694 214 H726 M694 226 H726 M710 226 V390"/>
    <!-- diode and output rail (node out) -->
    <path d="M784 57 V83"/>
    <path d="M784 70 H960"/>
    <!-- COUT branch: COUT, RCOUT, LCOUT -->
    <path d="M840 70 V110 M824 110 H856 M824 122 H856 M840 122 V150"/>
    <rect x="830" y="150" width="20" height="50"/>
    <path d="M840 200 V220 a12 12 0 0 1 0 24 a12 12 0 0 1 0 24 V390"/>
    <!-- RLOAD -->
    <path d="M960 70 V190 M960 270 V390"/>
    <rect x="949" y="190" width="22" height="80"/>
    <!-- secondary ground -->
    <path d="M770 390 V412 M756 412 H784 M761 419 H779 M766 426 H774"/>
  </g>
  <g fill="#111111" stroke="none">
    <path d="M760 57 L784 70 L760 83 Z"/>
    <path d="M569 385 L579 380 L579 390 Z"/>
    <circle cx="566" cy="152" r="4"/>
    <circle cx="644" cy="290" r="4"/>
    <circle cx="170" cy="70" r="3.5"/>
    <circle cx="290" cy="70" r="3.5"/>
    <circle cx="405" cy="70" r="3.5"/>
    <circle cx="710" cy="70" r="3.5"/>
    <circle cx="840" cy="70" r="3.5"/>
    <circle cx="710" cy="390" r="3.5"/>
    <circle cx="770" cy="390" r="3.5"/>
    <circle cx="840" cy="390" r="3.5"/>
    <text x="56" y="166" font-size="14">+</text>
    <text x="84" y="166">VIN</text>
    <text x="84" y="183">5 V, ideal</text>
    <text x="194" y="120">CIN 1000 µF</text>
    <text x="188" y="180">RCIN 0.1 Ω</text>
    <text x="190" y="250">LCIN 15 nH</text>
    <text x="314" y="120">CBYP 1 µF</text>
    <text x="308" y="180">RCBYP 10 mΩ</text>
    <text x="100" y="392">VPWM pulse</text>
    <text x="100" y="409">0 to 3.3 V, 100 kHz</text>
    <text x="100" y="426">D = 0.49, 10 ns edges</text>
    <text x="350" y="353" font-weight="bold">XDRV  MCP1407</text>
    <text x="350" y="371">delay 70 ns</text>
    <text x="350" y="388">up 4.0 Ω, down 2.7 Ω</text>
    <text x="350" y="405">thresholds 1.6 / 1.3 V</text>
    <text x="492" y="110">RP 15 mΩ</text>
    <text x="490" y="225">LP 10 µH</text>
    <text x="470" y="40"><tspan font-weight="bold">XT1  DA2033-AL</tspan>, k = 0.99277</text>
    <text x="656" y="225">LS</text>
    <text x="656" y="242">1 mH</text>
    <text x="648" y="330">RS 1.1 Ω</text>
    <text x="734" y="218">CW</text>
    <text x="734" y="235">25 pF</text>
    <text x="730" y="40"><tspan font-weight="bold">XD1  QH05TZ600</tspan>, fitted model</text>
    <text x="864" y="120">COUT 2.2 µF</text>
    <text x="858" y="180">RCOUT 22 mΩ</text>
    <text x="860" y="250">LCOUT 27 nH</text>
    <text x="980" y="226">RLOAD</text>
    <text x="980" y="243">9.63 kΩ</text>
    <text x="596" y="420" font-weight="bold">XQ1  CSD18533KCS</text>
    <text x="596" y="437">VDMOS model</text>
  </g>
  <!-- node names as used in the netlist -->
  <g fill="#1f5fbf" stroke="none" font-family="Menlo, Consolas, monospace" font-size="12">
    <text x="110" y="62">vin</text>
    <text x="286" y="362">pwm</text>
    <text x="512" y="362">gate</text>
    <text x="536" y="322">drain</text>
    <text x="660" y="62">sec</text>
    <text x="870" y="62">out</text>
    <text x="800" y="408">0</text>
  </g>
</svg>
