<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Helvetica, Arial, sans-serif" font-size="16">
  <rect width="640" height="380" fill="#ffffff"/>
  <g fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- input wire -->
    <path d="M66 60 H210 V80"/>
    <!-- primary winding -->
    <path d="M210 80 a15 15 0 0 0 0 30 a15 15 0 0 0 0 30 a15 15 0 0 0 0 30 a15 15 0 0 0 0 30"/>
    <!-- core -->
    <path d="M226 78 V202 M234 78 V202"/>
    <!-- secondary winding -->
    <path d="M250 80 a15 15 0 0 1 0 30 a15 15 0 0 1 0 30 a15 15 0 0 1 0 30 a15 15 0 0 1 0 30"/>
    <!-- primary to MOSFET drain -->
    <path d="M210 200 V255 H198"/>
    <!-- MOSFET: channel, gate, source -->
    <path d="M198 245 V295"/>
    <path d="M190 250 V290"/>
    <path d="M190 270 H116"/>
    <path d="M198 285 H210 V320"/>
    <!-- primary ground -->
    <path d="M196 320 H224 M201 327 H219 M206 334 H214"/>
    <!-- secondary top: to diode and output -->
    <path d="M250 80 V60 H330"/>
    <path d="M354 60 H574"/>
    <path d="M354 47 V73"/>
    <!-- secondary bottom rail -->
    <path d="M250 200 V240 H510"/>
    <!-- capacitor -->
    <path d="M430 60 V142 M414 142 H446 M414 154 H446 M430 154 V240"/>
    <!-- resistor -->
    <path d="M510 60 V110 M510 190 V240"/>
    <rect x="499" y="110" width="22" height="80"/>
    <!-- secondary ground -->
    <path d="M340 240 V262 M326 262 H354 M331 269 H349 M336 276 H344"/>
    <!-- terminals -->
    <circle cx="60" cy="60" r="6" fill="#ffffff"/>
    <circle cx="580" cy="60" r="6" fill="#ffffff"/>
    <circle cx="110" cy="270" r="6" fill="#ffffff"/>
  </g>
  <g fill="#111111" stroke="none">
    <!-- diode body -->
    <path d="M330 47 L354 60 L330 73 Z"/>
    <!-- MOSFET source arrow -->
    <path d="M199 285 L209 280 L209 290 Z"/>
    <!-- polarity dots -->
    <circle cx="196" cy="70" r="4"/>
    <circle cx="264" cy="212" r="4"/>
    <!-- junctions -->
    <circle cx="430" cy="60" r="3.5"/>
    <circle cx="510" cy="60" r="3.5"/>
    <circle cx="430" cy="240" r="3.5"/>
    <circle cx="340" cy="240" r="3.5"/>
    <!-- Ip arrow -->
    <path d="M210 232 L205 220 L215 220 Z"/>
    <!-- labels -->
    <text x="38" y="40">V<tspan font-size="11" dy="4">in</tspan></text>
    <text x="560" y="40">V<tspan font-size="11" dy="4">out</tspan></text>
    <text x="70" y="250">V<tspan font-size="11" dy="4">pwm</tspan></text>
    <text x="160" y="146">L<tspan font-size="11" dy="4">p</tspan></text>
    <text x="278" y="146">L<tspan font-size="11" dy="4">s</tspan></text>
    <text x="212" y="44">1 : N</text>
    <text x="336" y="36">D</text>
    <text x="454" y="154">C</text>
    <text x="532" y="156">R</text>
    <text x="222" y="276">Q</text>
    <text x="220" y="230">I<tspan font-size="11" dy="4">p</tspan></text>
  </g>
</svg>
